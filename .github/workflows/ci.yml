name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · test · rules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests (against the fake cabinet — no Windows, no network)
        run: npm run test
      - name: repository rules
        run: npm run lint
      - name: build
        run: npm run build
      - name: the built CLI runs and shows its help
        run: node dist/cli.js --help
      - name: the built CLI refuses without a kit root
        run: |
          node dist/cli.js status >status.out 2>&1 && exit 1
          grep -q "no kit root" status.out
      - name: npm i -g . gives a fagent that runs from any folder (M2)
        run: |
          npm i -g . --prefix "$RUNNER_TEMP/global"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/global/bin/fagent" --version | tee version.out
          grep -q "fagent $(node -p "require('$GITHUB_WORKSPACE/package.json').version")" version.out
          "$RUNNER_TEMP/global/bin/fagent" help >help.out 2>help.err
          grep -q "fagent — the agent harness" help.out
          if grep -q ExperimentalWarning help.err; then echo "the installed command prints the SQLite warning"; exit 1; fi

  windows:
    name: windows wiring (no cabinet here)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: argv is PowerShell-shaped on Windows
        run: node --no-warnings src/cli.ts --help
      - name: the fake kit answers through a real child process
        run: node test/kit/fake-kit-process.mjs -NoProfile -ExecutionPolicy Bypass -File x\api\Invoke-KitApi.ps1 -Operation status
      - name: npm i -g . gives a working fagent.cmd (M2)
        shell: pwsh
        run: |
          npm i -g . --prefix "$env:RUNNER_TEMP\global"
          Set-Location $env:RUNNER_TEMP
          $out = & "$env:RUNNER_TEMP\global\fagent.cmd" --version
          if ($out -notmatch '^fagent \d+\.\d+\.\d+') { throw "unexpected: $out" }
          $out
